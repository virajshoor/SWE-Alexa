# SWE-Alexa evaluation config
dataset: princeton-nlp/SWE-bench_Verified
split: test
limit: 40
workers: 4
wait_seconds: 45
model_name: Alexa-Rufus-1
amazon_home: https://www.amazon.com/
notes: |
  Alexa for Shopping is only available on amazon.com for signed-in US customers.
  This harness drives the web chat UI with Playwright and collects unified diffs.
